// ── Abrir/limpiar DB y cargar todo ───────────────────────────────
async function loadDemo() {
  try {
    setBar(5, 'Abriendo base de datos…');
    const db = await new Promise((res,rej) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = ev => {
        const d = req.result;
        const schema = {
          gastos:    { keyPath:'id', indexes:['fecha','tarjeta_id','cuenta_id','categoria','updated_at'] },
          ingresos:  { keyPath:'id', indexes:['fecha','periodo_aplicacion','cuenta_id','categoria','updated_at'] },
          tarjetas:  { keyPath:'id', indexes:['nombre','updated_at'] },
          cuentas:   { keyPath:'id', indexes:['nombre','tipo','updated_at'] },
          metas:     { keyPath:'id', indexes:['prioridad','updated_at'] },
          ajustes:   { keyPath:'id' },
          sync_queue:{ keyPath:'qid', autoIncrement:true },
        };
        for (const [name, def] of Object.entries(schema)) {
          if (d.objectStoreNames.contains(name)) continue;
          const s = d.createObjectStore(name, def.autoIncrement?{keyPath:def.keyPath,autoIncrement:true}:{keyPath:def.keyPath});
          (def.indexes||[]).forEach(ix => s.createIndex(ix,ix,{unique:false}));
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror  = () => rej(req.error);
    });

    const stores = { tarjetas, cuentas, ingresos, gastos, metas };
    const labels = { tarjetas:'Cargando tarjetas', cuentas:'Cargando cuentas', ingresos:'Cargando ingresos', gastos:'Cargando gastos', metas:'Cargando metas' };
    const pcts   = { tarjetas:15, cuentas:25, ingresos:40, gastos:70, metas:85 };

    for (const [store, items] of Object.entries(stores)) {
      setBar(pcts[store], labels[store]+'…');
      await new Promise((res,rej) => {
        const tx = db.transaction(store, 'readwrite');
        const s  = tx.objectStore(store);
        s.clear();
        items.forEach(it => s.put(it));
        tx.oncomplete = res;
        tx.onerror    = () => rej(tx.error);
      });
    }

    setBar(92, 'Guardando ajustes…');
    await new Promise((res,rej) => {
      const tx = db.transaction('ajustes','readwrite');
      tx.objectStore('ajustes').put(ajustes);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });

    setBar(100, 'Listo — redirigiendo…');
    btn.style.display = 'block';
    setTimeout(() => { location.href = '/'; }, 1200);

  } catch(e) {
    errEl.textContent = 'Error: ' + e.message;
    status.textContent = '';
  }
}

loadDemo();
