name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/android-project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            '504667f4c0de7af1a06de9f4b1727b84351f2910' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Create signing keystore
        run: |
          keytool -genkey -v \
            -keystore android-twa/android-project/android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Gestor Finanzas,OU=Personal,O=Personal,L=BuenosAires,S=CABA,C=AR"

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android-twa/android-project/local.properties

      - name: Build release APK
        continue-on-error: true
        run: |
          cd android-twa/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=android123 \
            --no-daemon \
            --stacktrace 2>&1 | tee /tmp/gradle-build.log
          test -f app/build/outputs/apk/release/app-release.apk && echo "APK_EXISTS=true" >> "$GITHUB_ENV" || echo "APK_EXISTS=false" >> "$GITHUB_ENV"

      - name: Upload Gradle log (para diagnóstico)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Show SHA-256 fingerprint
        if: env.APK_EXISTS == 'true'
        run: |
          echo "=== SHA-256 FINGERPRINT ==="
          keytool -list -v \
            -keystore android-twa/android-project/android.keystore \
            -alias android \
            -storepass android123 2>/dev/null | grep -i "sha256"

      - name: Prepare APK for release
        if: env.APK_EXISTS == 'true'
        run: |
          cp android-twa/android-project/app/build/outputs/apk/release/app-release.apk /tmp/gestor-finanzas.apk
          # Extraer version del manifest
          VERSION=$(grep 'versionName' android-twa/android-project/app/build.gradle | head -1 | grep -o '"[^"]*"' | tr -d '"')
          BUILD_DATE=$(date '+%d/%m/%Y %H:%M UTC')
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (latest)
        if: env.APK_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Borrar release y tag anterior si existen
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          # Crear release nuevo con el APK
          gh release create latest /tmp/gestor-finanzas.apk \
            --title "Gestor de Finanzas v${{ env.APK_VERSION }} — APK Android" \
            --notes "## Descargar APK

**[⬇ gestor-finanzas.apk](https://github.com/zeuss47/gestor-de-finanzas/releases/latest/download/gestor-finanzas.apk)**

Versión \`${{ env.APK_VERSION }}\` — generada el ${{ env.BUILD_DATE }}

### Instalación
1. Descargá el archivo \`gestor-finanzas.apk\`
2. En Android: **Configuración → Seguridad → Fuentes desconocidas** (activar)
3. Abrí el archivo descargado e instalá
4. Si ya tenés una versión instalada con firma diferente, desinstalá primero

### Notas
- La app carga la PWA en tiempo real — el contenido siempre está actualizado
- Solo hace falta reinstalar el APK cuando hay nuevas funciones nativas (widgets, permisos, etc.)" \
            --latest
          echo "Release publicado: https://github.com/zeuss47/gestor-de-finanzas/releases/latest"

      - name: Upload APK artifact (backup 60 días)
        if: env.APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-apk
          path: /tmp/gestor-finanzas.apk
          retention-days: 60

      - name: Fail if APK was not produced
        if: env.APK_EXISTS != 'true'
        run: |
          echo "Build failed — APK not produced. Download 'gradle-build-log' artifact for details."
          exit 1
