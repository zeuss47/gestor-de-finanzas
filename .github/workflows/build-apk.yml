name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/android-project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            '504667f4c0de7af1a06de9f4b1727b84351f2910' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d \
            > android-twa/android-project/android.keystore
          echo "Keystore SHA256: $(sha256sum android-twa/android-project/android.keystore | cut -d' ' -f1)"

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android-twa/android-project/local.properties

      - name: Build release APK
        continue-on-error: true
        run: |
          cd android-twa/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=android123 \
            -PversionCode=${{ github.run_number }} \
            --no-daemon \
            --stacktrace 2>&1 | tee /tmp/gradle-build.log
          test -f app/build/outputs/apk/release/app-release.apk \
            && echo "APK_EXISTS=true" >> "$GITHUB_ENV" \
            || echo "APK_EXISTS=false" >> "$GITHUB_ENV"

      - name: Upload Gradle log (para diagnostico)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Prepare APK and release notes
        if: env.APK_EXISTS == 'true'
        run: |
          cp android-twa/android-project/app/build/outputs/apk/release/app-release.apk \
             /tmp/gestor-finanzas.apk
          VERSION=$(grep 'versionName' android-twa/android-project/app/build.gradle \
            | head -1 | grep -o '"[^"]*"' | tr -d '"')
          BUILD_DATE=$(date '+%d/%m/%Y %H:%M UTC')
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_SHA=$(sha256sum /tmp/gestor-finanzas.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          keytool -list -v \
            -keystore android-twa/android-project/android.keystore \
            -alias android -storepass android123 2>/dev/null \
            | grep -i "sha256" || true

      - name: Build release notes
        if: env.APK_EXISTS == 'true'
        run: |
          APK_VERSION="${{ env.APK_VERSION }}"
          BUILD_DATE="${{ env.BUILD_DATE }}"
          APK_SHA="${{ env.APK_SHA }}"
          RUN_NUM="${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/zeuss47/gestor-de-finanzas/releases/latest/download/gestor-finanzas.apk"
          printf '## Gestor de Finanzas v%s\n\n' "$APK_VERSION" > /tmp/notes.md
          printf '**[Descargar gestor-finanzas.apk](%s)**\n\n' "$DOWNLOAD_URL" >> /tmp/notes.md
          printf 'Version `%s` | Build #%s | %s\n\n' "$APK_VERSION" "$RUN_NUM" "$BUILD_DATE" >> /tmp/notes.md
          printf 'SHA-256: `%s`\n\n' "$APK_SHA" >> /tmp/notes.md
          printf '### Instalacion\n' >> /tmp/notes.md
          printf '1. Descarga `gestor-finanzas.apk`\n' >> /tmp/notes.md
          printf '2. Android: Configuracion > Seguridad > Fuentes desconocidas (activar)\n' >> /tmp/notes.md
          printf '3. Abri el archivo e instala\n' >> /tmp/notes.md
          printf '4. Si hay version anterior con firma diferente, desinstala primero\n\n' >> /tmp/notes.md
          printf '> El contenido se actualiza automaticamente — solo reinstalar el APK cuando hay nuevas funciones nativas.\n' >> /tmp/notes.md

      - name: Publish GitHub Release
        if: env.APK_EXISTS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APK_VERSION }}-b${{ github.run_number }}"
          name: "Gestor de Finanzas v${{ env.APK_VERSION }} (build #${{ github.run_number }})"
          body_path: /tmp/notes.md
          files: /tmp/gestor-finanzas.apk
          make_latest: true
          token: ${{ github.token }}

      - name: Upload APK artifact (backup 60 dias)
        if: env.APK_EXISTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-apk
          path: /tmp/gestor-finanzas.apk
          retention-days: 60

      - name: Fail if APK was not produced
        if: env.APK_EXISTS != 'true'
        run: |
          echo "Build failed. Descarga 'gradle-build-log' para diagnosticar."
          exit 1
