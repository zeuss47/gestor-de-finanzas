name: Build Android APK (TWA)

# Dispara: al hacer push a main, o manualmente desde la pestaña Actions
on:
  push:
    branches: [main]
    paths:
      - 'android-twa/**'
      - 'manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK con Bubblewrap
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Código fuente ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK 17 (requerido por Android Gradle Plugin 7+) ────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js para @bubblewrap/core ──────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-twa/package.json

      # ── 4. Android SDK: instalar plataformas y build-tools ────────
      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            --sdk_root=$ANDROID_HOME 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" || true

      # ── 5. Instalar @bubblewrap/core ──────────────────────────────
      - name: Install build dependencies
        run: cd android-twa && npm install

      # ── 6. Generar proyecto Android desde twa-manifest.json ───────
      - name: Generate Android TWA project
        run: cd android-twa && node build-apk.cjs

      # ── 7. Crear keystore de firma ────────────────────────────────
      #    Si el Secret KEYSTORE_BASE64 existe, lo usamos (firma estable).
      #    Si no, generamos uno nuevo (solo para prueba; requiere re-instalar
      #    si cambia entre builds).
      - name: Prepare signing keystore
        run: |
          cd android-twa/android-project
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Usando keystore desde GitHub Secret…"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore
          else
            echo "Generando nuevo keystore (solo para prueba)…"
            keytool -genkey -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Gestor Finanzas, OU=Personal, O=Personal, L=Buenos Aires, S=CABA, C=AR" \
              2>/dev/null
          fi
          echo "Keystore listo."

      # ── 8. Escribir local.properties con la ruta del SDK ──────────
      - name: Configure SDK path for Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-twa/android-project/local.properties

      # ── 9. Compilar APK release firmado ───────────────────────────
      - name: Build signed release APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android123' }}
          KEY_PASS:   ${{ secrets.KEY_PASSWORD      || 'android123' }}
        run: |
          cd android-twa/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
            -Pandroid.injected.signing.store.password=${STORE_PASS:-android123} \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=${KEY_PASS:-android123} \
            --no-daemon \
            --stacktrace

      # ── 10. Mostrar fingerprint para assetlinks.json ──────────────
      - name: Print APK fingerprint (para assetlinks.json)
        run: |
          cd android-twa/android-project
          echo ""
          echo "=== SHA-256 FINGERPRINT (copiar en assetlinks.json) ==="
          keytool -printcert \
            -jarfile app/build/outputs/apk/release/app-release.apk \
            2>/dev/null | grep -i "sha256" || \
          keytool -list -v \
            -keystore android.keystore \
            -alias android \
            -storepass ${STORE_PASS:-android123} 2>/dev/null | grep -i "sha256"
          echo "======================================================"

      # ── 11. Subir APK como artefacto descargable ──────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-${{ github.run_number }}
          path: |
            android-twa/android-project/app/build/outputs/apk/release/app-release.apk
          retention-days: 60
          if-no-files-found: error

      # ── 12. (Opcional) Subir keystore generado para guardarlo ──────
      - name: Upload keystore (si fue generado, para guardarlo como Secret)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          cd android-twa/android-project
          echo ""
          echo "=== KEYSTORE EN BASE64 (guardar en Secret KEYSTORE_BASE64) ==="
          base64 android.keystore
          echo "================================================================"
          echo "Ve a: Settings → Secrets → Actions → New repository secret"
          echo "  Nombre: KEYSTORE_BASE64"
          echo "  Valor:  (pegar el base64 de arriba)"
          echo ""
          echo "  También agregar:"
          echo "  KEYSTORE_PASSWORD = android123"
          echo "  KEY_PASSWORD      = android123"
