name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-twa/android-project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses (write hashes directly)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            '504667f4c0de7af1a06de9f4b1727b84351f2910' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "Licenses written OK"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "sdkmanager path: $SDKMANAGER"
          ls "$ANDROID_HOME/cmdline-tools/" || echo "No cmdline-tools"
          $SDKMANAGER \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"
          echo "SDK install done"
          ls "$ANDROID_HOME/build-tools/" || echo "No build-tools"
          ls "$ANDROID_HOME/platforms/" || echo "No platforms"

      - name: Create signing keystore
        run: |
          keytool -genkey -v \
            -keystore android-twa/android-project/android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Gestor Finanzas,OU=Personal,O=Personal,L=BuenosAires,S=CABA,C=AR"

      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android-twa/android-project/local.properties

      - name: Build release APK
        run: |
          cd android-twa/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=android \
            -Pandroid.injected.signing.key.password=android123 \
            --no-daemon \
            --stacktrace

      - name: Show SHA-256 fingerprint (para assetlinks.json)
        run: |
          echo "=== SHA-256 FINGERPRINT ==="
          keytool -list -v \
            -keystore android-twa/android-project/android.keystore \
            -alias android \
            -storepass android123 2>/dev/null | grep -i "sha256"
          echo "==========================="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestor-finanzas-apk
          path: android-twa/android-project/app/build/outputs/apk/release/app-release.apk
          retention-days: 60
          if-no-files-found: error
